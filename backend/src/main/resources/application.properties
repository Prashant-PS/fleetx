# Render (and most hosts) set PORT; 8090 locally.
server.port=${PORT:8090}
spring.application.name=fleetboard-search

# Workbook to index. Empty = the copy bundled at src/main/resources/data/fleet-data.xlsx.
# Point this at another .xlsx file path to search different data without rebuilding.
fleet.data.file=

# AI answers (optional). Enabled only when ANTHROPIC_API_KEY is set in the environment;
# otherwise answers are composed locally from the workbook.
fleet.ai.enabled=true
fleet.ai.model=claude-opus-5-5
# low | medium | high | xhigh | max — higher is more thorough but slower
fleet.ai.effort=medium
# Let Claude search the web for vehicle specs, prices, regulations and news (billed per search)
fleet.ai.web-search=true

# Latest fleet news: "Name|RSS or Atom URL" entries, refreshed every fleet.news.refresh-minutes.
fleet.news.refresh-minutes=30
fleet.news.feeds=\
  Trucking Info (HDT)|https://www.truckinginfo.com/rss,\
  Transport Topics|https://www.ttnews.com/rss.xml,\
  FreightWaves|https://www.freightwaves.com/news/feed,\
  CCJ|https://www.ccjdigital.com/rss,\
  Automotive Fleet|https://www.automotivefleet.com/rss,\
  Work Truck|https://www.worktruckonline.com/rss,\
  Motor India|https://www.motorindiaonline.in/feed/,\
  Sustainable Bus|https://www.sustainable-bus.com/feed/

# Assistant workspace: saved items, schedules, custom agents and notifications.
fleet.store.file=./data/fleetboard-store.json
# Shown in the greeting; leave empty to let each user set their name in the app.
fleet.user.name=
fleet.user.role=Fleet Manager
# Schedules, news refresh and agent runs share this pool.
spring.task.scheduling.pool.size=3

# Optional demo password (env FLEET_DEMO_PASSWORD). When set, every page and API asks for it
# through the browser's sign-in prompt (any user name). Empty = open access.
fleet.demo.password=
# Compress JSON, HTML, JS and CSS responses.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript
